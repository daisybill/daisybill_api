version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
    day: monday
    time: "10:00"
  open-pull-requests-limit: 5
  groups:
    bundler-production:
      dependency-type: production
      patterns:
      - "*"
      update-types:
      - minor
      - patch
    bundler-development:
      dependency-type: development
      patterns:
      - "*"
      update-types:
      - minor
      - patch
    # Security updates ignore the groups above unless a group opts in via
    # "applies-to: security-updates". "update-types" has no effect on them.
    bundler-security-production:
      applies-to: security-updates
      dependency-type: production
      patterns:
      - "*"
    bundler-security-development:
      applies-to: security-updates
      dependency-type: development
      patterns:
      - "*"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    day: monday
    time: "10:00"
  open-pull-requests-limit: 5
  groups:
    github-actions:
      patterns:
      - "*"
      update-types:
      - minor
      - patch
