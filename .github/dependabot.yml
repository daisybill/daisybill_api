version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
    day: monday
    time: "10:00"
  open-pull-requests-limit: 5
  groups:
    bundler-production:
      dependency-type: production
      patterns:
      - "*"
      update-types:
      - minor
      - patch
    bundler-development:
      dependency-type: development
      patterns:
      - "*"
      update-types:
      - minor
      - patch
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    day: monday
    time: "10:00"
  open-pull-requests-limit: 5
  groups:
    github-actions:
      patterns:
      - "*"
      update-types:
      - minor
      - patch
